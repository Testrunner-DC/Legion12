name: 验证主线代码

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: l12-verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    # Actual Linux rules alone take ~17 min; include the bounded first asset
    # fetch plus platform/frontend/publish without weakening any individual gate.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 生成目录绑定
        shell: pwsh
        env:
          L12_WORK_CACHE: ${{ runner.temp }}/l12-ci/cache
          L12_DEPENDENCY_CACHE: ${{ runner.temp }}/l12-ci/dependencies
          L12_ARTIFACT_ROOT: ${{ runner.temp }}/l12-ci/evidence
          L12_ARCHIVE_ROOT: ${{ runner.temp }}/l12-ci/archives
          NUGET_PACKAGES: ${{ runner.temp }}/l12-ci/dependencies/nuget/packages
          npm_config_cache: ${{ runner.temp }}/l12-ci/dependencies/npm
        run: |
          $ErrorActionPreference = 'Stop'
          & ./ops/windows/Initialize-L12BuildEnvironment.ps1 | Out-Null
          foreach ($name in @('L12_WORK_CACHE','L12_DEPENDENCY_CACHE','L12_ARTIFACT_ROOT','L12_ARCHIVE_ROOT','L12_PWSH','TEMP','TMP','TMPDIR','DOTNET_CLI_HOME','NUGET_PACKAGES','NUGET_HTTP_CACHE_PATH','npm_config_cache','COREPACK_HOME')) {
            $value = [Environment]::GetEnvironmentVariable($name, 'Process')
            if ([string]::IsNullOrWhiteSpace($value) -or $value.Contains("`n") -or $value.Contains("`r")) { throw 'Invalid bound CI environment' }
            "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/l12-ci/dependencies/nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: opcgpro-vue/package-lock.json

      - name: 构建宿主边界验证
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $hostLog = Join-Path $env:L12_ARTIFACT_ROOT 'host-native.log'
          New-Item -ItemType Directory -Path $env:L12_ARTIFACT_ROOT -Force | Out-Null
          try {
            & ./scripts/test-l12-build-host.ps1 -WorkRoot $env:L12_WORK_CACHE 2>&1 | Tee-Object -FilePath $hostLog
            node scripts/test-ci-host-step.mjs 2>&1 | Tee-Object -FilePath $hostLog -Append
            if ($LASTEXITCODE -ne 0) { throw 'CI native failure propagation fixture failed' }
          } catch {
            $tail = ($_ | Out-String)
            if (Test-Path -LiteralPath $hostLog) { $tail += (Get-Content -LiteralPath $hostLog -Tail 24) -join "`n" }
            $tailBytes = [Text.Encoding]::UTF8.GetBytes($tail)
            if ($tailBytes.Length -gt 3000) {
              $start = $tailBytes.Length - 3000
              while (($tailBytes[$start] -band 0xC0) -eq 0x80) { $start++ }
              $tail = [Text.Encoding]::UTF8.GetString($tailBytes, $start, $tailBytes.Length - $start)
            }
            $tail = $tail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=L12 host boundary actual failure::$tail"
            throw
          }

      - name: P0-P4 架构退出锁
        run: node scripts/check-l12-architecture-lock.mjs

      - name: 唯一发布包入口约束
        run: node scripts/test-ci-release-entry.mjs

      - name: 可信卡图输入边界（仅合成目录）
        run: |
          python3 -I -B ops/ci/test-l12-card-assets-input.py --work-root "$RUNNER_TEMP/l12-card-input"
          python3 -I -B ops/ci/l12-card-assets-input.py check --lock ops/ci/l12-card-assets-input.lock.json

      - name: 测试快照轮转边界（仅合成目录）
        run: bash scripts/test-l12-runtime-backup-retention.sh ops/server/deploy-l12-testrun-release.sh "$RUNNER_TEMP"

      - name: 发布状态来源回归
        run: node scripts/test-release-status.mjs

      - name: 标准出包选择与边界
        id: policy
        shell: pwsh
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_HEAD: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          node ops/ci/test-l12-package-policy.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Canonical source policy regression failed' }
          node ops/ci/test-l12-canonical-step.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Canonical adapter regression failed' }
          python3 -I -B ops/ci/test-l12-canonical-artifacts.py --work-root "$env:L12_WORK_CACHE/artifact-fixtures"
          if ($LASTEXITCODE -ne 0) { throw 'Canonical artifact boundary regression failed' }
          $selection = node ops/ci/l12-package-policy.mjs $env:CI_EVENT_NAME $env:GITHUB_EVENT_PATH $env:CI_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Canonical source policy failed' }
          $selection = $selection | ConvertFrom-Json
          "package=$($selection.package.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "verify=$($selection.verify.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "commit=$($selection.commit)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host $selection.reason

      - name: 可信卡图精确缓存
        if: steps.policy.outputs.package == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.L12_WORK_CACHE }}/card-input
          key: l12-card-input-${{ runner.os }}-${{ hashFiles('ops/ci/l12-card-assets-input.lock.json', 'ops/ci/l12-card-assets-input.py') }}

      - name: 唯一标准发布包
        id: canonical
        if: steps.policy.outputs.package == 'true'
        shell: pwsh
        env:
          CI_HEAD: ${{ steps.policy.outputs.commit }}
        run: ./ops/ci/invoke-l12-canonical-package.ps1 -Commit $env:CI_HEAD -CardAssetRoot "$env:L12_WORK_CACHE/card-input" -OutputRoot "$env:L12_ARTIFACT_ROOT/canonical"

      - name: 安装前端依赖
        if: steps.policy.outputs.verify == 'true'
        working-directory: opcgpro-vue
        run: npm ci --prefer-offline --no-audit

      - name: 前端生产构建
        if: steps.policy.outputs.verify == 'true'
        working-directory: opcgpro-vue
        shell: pwsh
        env:
          VITE_APP_VERSION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $OutputEncoding = [Console]::OutputEncoding = [Text.UTF8Encoding]::new($false)
          $log = Join-Path $env:L12_ARTIFACT_ROOT 'frontend-native.log'
          New-Item -ItemType Directory -Path $env:L12_ARTIFACT_ROOT -Force | Out-Null
          npm run build 2>&1 | Tee-Object -FilePath $log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $tail = (Get-Content -LiteralPath $log -Tail 24) -join "`n"
            $tailBytes = [Text.Encoding]::UTF8.GetBytes($tail)
            if ($tailBytes.Length -gt 3000) {
              $start = $tailBytes.Length - 3000
              while (($tailBytes[$start] -band 0xC0) -eq 0x80) { $start++ }
              $tail = [Text.Encoding]::UTF8.GetString($tailBytes, $start, $tailBytes.Length - $start)
            }
            $tail = $tail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=L12 frontend actual failure::$tail"
            exit $buildExit
          }

      - name: L12 规则测试
        if: steps.policy.outputs.verify == 'true'
        shell: pwsh
        run: ./scripts/invoke-l12-tests.ps1 -Project ./TwelveLegions.Tests/TwelveLegions.Tests.csproj

      - name: 平台与控制面测试
        if: steps.policy.outputs.verify == 'true'
        shell: pwsh
        run: ./scripts/invoke-l12-tests.ps1 -Project ./TwelveLegions.Platform.Tests/TwelveLegions.Platform.Tests.csproj

      # Both mutually exclusive lanes retain full rules/platform/frontend gates.
      # Only verify-l12.ps1 creates packages; CI never deploys or changes services.
      # External attachment publication awaits its separate data-transfer choice.
