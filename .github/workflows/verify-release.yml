name: 验证主线代码

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: l12-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 生成目录绑定
        shell: pwsh
        env:
          L12_WORK_CACHE: ${{ runner.temp }}/l12-ci/cache
          L12_DEPENDENCY_CACHE: ${{ runner.temp }}/l12-ci/dependencies
          L12_ARTIFACT_ROOT: ${{ runner.temp }}/l12-ci/evidence
          L12_ARCHIVE_ROOT: ${{ runner.temp }}/l12-ci/archives
          NUGET_PACKAGES: ${{ runner.temp }}/l12-ci/dependencies/nuget/packages
          npm_config_cache: ${{ runner.temp }}/l12-ci/dependencies/npm
        run: |
          $ErrorActionPreference = 'Stop'
          & ./ops/windows/Initialize-L12BuildEnvironment.ps1 | Out-Null
          foreach ($name in @('L12_WORK_CACHE','L12_DEPENDENCY_CACHE','L12_ARTIFACT_ROOT','L12_ARCHIVE_ROOT','L12_PWSH','TEMP','TMP','TMPDIR','DOTNET_CLI_HOME','NUGET_PACKAGES','NUGET_HTTP_CACHE_PATH','npm_config_cache','COREPACK_HOME')) {
            $value = [Environment]::GetEnvironmentVariable($name, 'Process')
            if ([string]::IsNullOrWhiteSpace($value) -or $value.Contains("`n") -or $value.Contains("`r")) { throw 'Invalid bound CI environment' }
            "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/l12-ci/dependencies/nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: opcgpro-vue/package-lock.json

      - name: 构建宿主边界验证
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/test-l12-build-host.ps1 -WorkRoot $env:L12_WORK_CACHE
          node scripts/test-ci-host-step.mjs
          if ($LASTEXITCODE -ne 0) { throw 'CI native failure propagation fixture failed' }

      - name: P0-P4 架构退出锁
        run: node scripts/check-l12-architecture-lock.mjs

      - name: 唯一发布包入口约束
        run: node scripts/test-ci-release-entry.mjs

      - name: 可信卡图输入边界（仅合成目录）
        run: |
          python3 -I -B ops/ci/test-l12-card-assets-input.py --work-root "$RUNNER_TEMP/l12-card-input"
          python3 -I -B ops/ci/l12-card-assets-input.py check --lock ops/ci/l12-card-assets-input.lock.json

      - name: 测试快照轮转边界（仅合成目录）
        run: bash scripts/test-l12-runtime-backup-retention.sh ops/server/deploy-l12-testrun-release.sh "$RUNNER_TEMP"

      - name: 发布状态来源回归
        run: node scripts/test-release-status.mjs

      - name: 安装前端依赖
        working-directory: opcgpro-vue
        run: npm ci --prefer-offline --no-audit

      - name: 前端生产构建
        working-directory: opcgpro-vue
        shell: pwsh
        env:
          VITE_APP_VERSION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $log = Join-Path $env:L12_ARTIFACT_ROOT 'frontend-native.log'
          New-Item -ItemType Directory -Path $env:L12_ARTIFACT_ROOT -Force | Out-Null
          npm run build 2>&1 | Tee-Object -FilePath $log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $tail = (Get-Content -LiteralPath $log -Tail 24) -join "`n"
            if ($tail.Length -gt 8000) { $tail = $tail.Substring($tail.Length - 8000) }
            $tail = $tail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Host "::error title=L12 frontend actual failure::$tail"
            exit $buildExit
          }

      - name: L12 规则测试
        shell: pwsh
        run: ./scripts/invoke-l12-tests.ps1 -Project ./TwelveLegions.Tests/TwelveLegions.Tests.csproj

      - name: 平台与控制面测试
        shell: pwsh
        run: ./scripts/invoke-l12-tests.ps1 -Project ./TwelveLegions.Platform.Tests/TwelveLegions.Platform.Tests.csproj

      # Reviewed asset bytes are pinned in ops/ci/l12-card-assets-input.lock.json.
      # Canonical verify-l12.ps1 still needs a separately qualified portable
      # host entry before CI can build deployable packages. Do not hand-pack one.
