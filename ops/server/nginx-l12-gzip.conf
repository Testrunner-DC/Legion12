# 主站文本资产 gzip 策略。本片段只允许 include 在 legion-12.com 的 HTTPS server 块内
# （server 上下文）；与 ops/server/legion12-testrun.nginx 里的同批指令逐行同构，
# 任何一侧调整压缩级别、允许清单或阈值都必须同步另一侧。
# 本片段只有 gzip_* 指令：不含 add_header、proxy_* 或 expires，因此既不改动任何
# location 的 Cache-Control 语义，也不会因"子层出现 add_header 会覆盖父层同名集合"而生效异常。
gzip on;

# 允许携带 Via 头的上游/CDN 请求也获得压缩。默认值 off 会让经过 CDN 的浏览器请求
# 全部退回明文，等于只在直连场景生效。
gzip_proxied any;

# 压缩结果随 Accept-Encoding 变化，必须显式加 Vary，避免中间缓存把压缩体回给不支持的客户端。
gzip_vary on;

# 级别 5 是 CPU 与压缩率的折中：相对默认级别 1，文本通常再省 15%-20% 字节；
# 级别 9 的额外收益很小而 CPU 明显上升，不适合在反代上按请求现压。
gzip_comp_level 5;

# 阈值 1024 字节：压缩有固定头尾开销（约 18 字节）加每次请求的压缩调用，
# 小于 1 KiB 的错误 JSON、健康检查和短元数据压缩后常只省几十字节，收益低于成本；
# 而本批真正要压的实体（index.html、/assets/*.js|css、/data/*.json、/api JSON）
# 都远超 1 KiB，因此该阈值不牺牲实际收益。
gzip_min_length 1024;

# 允许清单只放文本与结构化文本。已压缩格式（image/jpeg、image/png、image/webp、
# image/avif、image/gif、video/*、audio/*、字体、application/zip、application/pdf）
# 一律不列入：gzip_types 是允许清单，未列出即不压缩，避免二次压缩白耗 CPU。
# text/html 在 gzip on 时由 nginx 无条件压缩，无需也不能通过 gzip_types 控制。
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/xml
    application/xhtml+xml
    image/svg+xml;
