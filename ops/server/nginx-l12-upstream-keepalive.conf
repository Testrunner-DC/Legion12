# 主站 /api 反代的 upstream keepalive 池。
# upstream 是 http 上下文指令：本片段必须 include 在 /etc/nginx/nginx.conf 的 http 块内，
# 不能写进 server 或 location 块（否则 nginx -t 报 "upstream" directive is not allowed here）。
# activate-l12-upstream-keepalive.sh 负责安装本片段、插入 include 行，并把主站 /api 前缀
# 反代的 proxy_pass 指向本 upstream，同时在同一 location 内补上：
#     proxy_http_version 1.1;
#     proxy_set_header Connection "";
# 三件套缺任何一件都不会复用连接，只是把 HTTP/1.0 短连接到同一个地址。
upstream l12_app_main {
    # 单机同源后端：地址仍是原来的 127.0.0.1:8083，不引入负载均衡、健康检查或超时变更。
    server 127.0.0.1:8083;

    # 每 worker 缓存 32 条空闲长连接：覆盖常规并发短请求，又不长期占用后端连接槽。
    # Kestrel 的空闲超时默认 130s，大于 nginx keepalive_timeout 默认 60s，
    # 因此总是 nginx 先关闭空闲连接，不会复用被后端单方关闭的连接。
    keepalive 32;
}
