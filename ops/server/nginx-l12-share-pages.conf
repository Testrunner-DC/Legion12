# Include this file inside the legion-12.com TLS server block. These locations
# override only the public home/news documents; assets, API and WebSocket routes
# keep their existing delivery path.
location = / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-L12-Share-Path $uri;
    proxy_pass http://127.0.0.1:8083/_l12/share-page;
}

location = /news {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-L12-Share-Path $uri;
    proxy_pass http://127.0.0.1:8083/_l12/share-page;
}

location = /news/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-L12-Share-Path $uri;
    proxy_pass http://127.0.0.1:8083/_l12/share-page;
}

location ~ ^/news/[^/]+/?$ {
    set $l12_share_path $uri;
    rewrite ^ /_l12/share-page break;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-L12-Share-Path $l12_share_path;
    proxy_pass http://127.0.0.1:8083;
}
