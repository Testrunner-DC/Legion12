# Include inside the legion-12.com TLS server block before the generic SPA location.
# /opt/legion12-web-assets atomically points at the selected artifact root's
# shared current/previous compatibility pool.
location ^~ /assets/ {
    root /opt/legion12-web-assets;
    try_files $uri =404;
    etag on;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}

# Audio uses stable filenames rather than content hashes. Keep a bounded fresh
# lifetime and retain normal ETag/range handling; missing audio must never return SPA HTML.
location ^~ /audio/ {
    root /opt/legion12-test/opcgpro-vue/dist;
    try_files $uri =404;
    etag on;
    # expires supplies max-age=86400 without replacing inherited security headers.
    expires 1d;
}

# Every SPA fallback internally resolves here. HTML must revalidate so a manual
# or one-shot recovery reload cannot keep referencing a retired release.
location = /index.html {
    root /opt/legion12-test/opcgpro-vue/dist;
    try_files /index.html =404;
    etag on;
    add_header Cache-Control "no-cache" always;
}
