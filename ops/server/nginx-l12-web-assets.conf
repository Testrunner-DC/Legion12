# Include inside the legion-12.com TLS server block before the generic SPA location.
# /opt/legion12-web-assets atomically points at the selected artifact root's
# shared current/previous compatibility pool.
location ^~ /assets/ {
    root /opt/legion12-web-assets;
    try_files $uri =404;
    etag on;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}

# Card/deck catalogs are public deploy data, not account state. Keep a short
# browser cache so opening battle, deck and archive pages does not re-download
# the same JSON on every navigation; the ETag still revalidates after expiry.
location ~ "^/data/l12/(?:cards\.(?:s1|lookup|st)|preset-decks\.s[12])\.json$" {
    root /opt/legion12-test/opcgpro-vue/dist;
    try_files $uri =404;
    etag on;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
}

# Legacy battle/card-loader JSON is public deploy data as well. Keep one
# bounded cache policy for the manifest and per-set files so entering battle
# does not refetch every card set after leaving the catalog page.
location ~ "^/data/(?:imageManifest|allCards|(?:OP|EB|ST|P|PRB|OPD|TY)[A-Z0-9]*)\.json$" {
    root /opt/legion12-test/opcgpro-vue/dist;
    try_files $uri =404;
    etag on;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
}

# Audio uses stable filenames rather than content hashes. Keep a bounded fresh
# lifetime and retain normal ETag/range handling; missing audio must never return SPA HTML.
location ^~ /audio/ {
    root /opt/legion12-test/opcgpro-vue/dist;
    try_files $uri =404;
    etag on;
    # expires supplies max-age=86400 without replacing inherited security headers.
    expires 1d;
}

# Every SPA fallback internally resolves here. HTML must revalidate so a manual
# or one-shot recovery reload cannot keep referencing a retired release.
location = /index.html {
    root /opt/legion12-test/opcgpro-vue/dist;
    try_files /index.html =404;
    etag on;
    add_header Cache-Control "no-cache" always;
}
