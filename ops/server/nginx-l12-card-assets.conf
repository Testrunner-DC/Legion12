# 必须 include 在主站 server 块内；只覆盖 /card-assets，不影响业务 JSON。
location = /card-assets/card-assets.manifest.json {
    root /opt/legion12-test/opcgpro-vue/dist;
    try_files $uri =404;
    etag on;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

location = /card-assets/card-assets.preload.json {
    root /opt/legion12-test/opcgpro-vue/dist;
    try_files $uri =404;
    etag on;
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

location ~ ^/card-assets/cards/[A-Za-z0-9._-]+/S[0-9]{2}-[A-Za-z0-9]+/[0-9a-f]{20}/[A-Za-z0-9._-]+\.(?:webp|avif)$ {
    root /opt/legion12-test/opcgpro-vue/dist;
    try_files $uri =404;
    etag on;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# 非内容寻址路径禁止被误设为长期缓存；畸形路径直接 404。
location /card-assets/ {
    root /opt/legion12-test/opcgpro-vue/dist;
    try_files $uri =404;
    etag on;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
