若任务触及并发、连接顺序、持久化数据、权限安全、生产恢复、部署或不可逆外部状态，立即停止修改并请求重新路由到关键档。
完成后运行聚焦、批次和必要的完整门禁，更新修复台账与状态文档并复查 diff；除非用户明确授权，不得提交、推送、部署或修改外部系统。
